<!DOCTYPE html>
<html lang="hi-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meri 3 Websites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --ink:#1b1a17; --muted:#6b675e; --line:#d9d4c8;
  --c1:#1fa463; --c2:#f08a1c; --c3:#2f6fe4;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16150f; --ink:#f3f0e6; --muted:#a29d8e; --line:#35322a;
    --c1:#3fd08a; --c2:#ffa64a; --c3:#6c9bff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16150f; --ink:#f3f0e6; --muted:#a29d8e; --line:#35322a;
  --c1:#3fd08a; --c2:#ffa64a; --c3:#6c9bff; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.5; min-height:100vh;
}
main{max-width:720px; margin:0 auto; padding:48px 20px 64px}
h1{font-size:clamp(2.2rem,8vw,3.6rem); line-height:1.02; letter-spacing:-.03em; margin:0 0 12px; font-weight:800}
.sub{color:var(--muted); margin:0 0 40px; font-size:1.05rem; max-width:44ch}
.list{border-top:1px solid var(--line)}
a.site{
  display:grid; grid-template-columns:64px 1fr auto; gap:18px; align-items:center;
  padding:22px 4px; border-bottom:1px solid var(--line);
  color:inherit; text-decoration:none;
}
a.site:hover .name,a.site:focus-visible .name{text-decoration:underline; text-decoration-color:var(--accent); text-decoration-thickness:3px; text-underline-offset:5px}
a.site:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.badge{
  width:64px; height:64px; border-radius:18px; background:var(--accent);
  display:grid; place-items:center; color:#fff;
}
.badge svg{width:32px; height:32px}
.name{font-size:1.5rem; font-weight:700; letter-spacing:-.01em}
.desc{color:var(--muted); font-size:.95rem; margin-top:2px}
.go{font-size:1.6rem; color:var(--accent); font-weight:700}
.s1{--accent:var(--c1)} .s2{--accent:var(--c2)} .s3{--accent:var(--c3)}
footer{margin-top:28px; color:var(--muted); font-size:.85rem}
@media (max-width:420px){
  a.site{grid-template-columns:52px 1fr auto; gap:14px}
  .badge{width:52px; height:52px; border-radius:15px}
  .badge svg{width:26px; height:26px}
  .name{font-size:1.3rem}
}
</style>
</head>
<body>
<main>
  <h1>Meri 3 websites</h1>
  <p class="sub">Photos, icons aur fonts ke liye teen kaam ki websites. Kisi pe bhi tap karo, nayi tab me khulegi.</p>

  <nav class="list" aria-label="Websites">
    <a class="site s1" href="https://pixabay.com/" target="_blank" rel="noopener noreferrer">
      <span class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>
      </span>
      <span><div class="name">Pixabay</div><div class="desc">Free photos, videos aur music</div></span>
      <span class="go" aria-hidden="true">↗</span>
    </a>

    <a class="site s2" href="https://www.flaticon.com/" target="_blank" rel="noopener noreferrer">
      <span class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.3 6.2 20.4l1.1-6.5L2.6 9.3l6.5-.9z"/></svg>
      </span>
      <span><div class="name">Flaticon</div><div class="desc">Icons aur stickers ka bada collection</div></span>
      <span class="go" aria-hidden="true">↗</span>
    </a>

    <a class="site s3" href="https://www.dafont.com/" target="_blank" rel="noopener noreferrer">
      <span class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19L9 5l6 14M5.2 14h7.6"/><path d="M16.5 19h4.5M18.75 19V11"/></svg>
      </span>
      <span><div class="name">DaFont</div><div class="desc">Free fonts download karo</div></span>
      <span class="go" aria-hidden="true">↗</span>
    </a>
  </nav>

  <footer>Download se pehle har item ka license zaroor check karo.</footer>
</main>
</body>
</html>
